{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - AI Bihari</title>
    <link rel="stylesheet" href="{% static 'chatbot/css/styles.css' %}">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #f4f7ff;
            font-family: Arial, sans-serif;
        }
        .auth-card {
            width: 100%;
            max-width: 420px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 24px;
        }
        h1 {
            margin: 0 0 16px;
            text-align: center;
            color: #0d6efd;
        }
        .field {
            margin-bottom: 14px;
        }
        label {
            display: block;
            margin-bottom: 4px;
            font-weight: 600;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #0d6efd;
            border: none;
            color: #fff;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
        .messages {
            margin-bottom: 12px;
        }
        .message {
            padding: 8px;
            border-radius: 8px;
            margin-bottom: 6px;
            font-size: 14px;
        }
        .errorlist, .message.error { background: #ffe3e3; color: #b00020; }
        .message.success { background: #e3fff0; color: #136f3a; }
        .message.info { background: #e8f2ff; color: #0b4b9e; }
        .switch-link {
            margin-top: 12px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="auth-card">
        <h1>{{ title }}</h1>

        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <div class="message {{ message.tags }}">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            {% for field in form %}
                <div class="field">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}<div class="errorlist">{{ field.errors }}</div>{% endif %}
                </div>
            {% endfor %}

            <button type="submit">{{ button_text }}</button>
        </form>

        <div class="switch-link">
            <a href="{% url alt_url_name %}">{{ alt_label }}</a>
        </div>
    </div>
</body>
</html>
